<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나를 소개하는 페이지</title>
  <style>
    /* 기본 리셋 및 스타일 설정 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #fff5f0 0%, #ffedd5 100%); /* 따뜻한 주황/레드 톤 배경 */
      color: #1e293b;
      line-height: 1.6;
      padding: 24px 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      position: relative;
      overflow-x: hidden;
    }

    /* 장식용 SVG 아이콘 스타일 */
    .bg-icon {
      position: absolute;
      opacity: 0.15;
      z-index: 0;
      pointer-events: none;
      animation: float 6s ease-in-out infinite alternate;
    }

    .bg-icon-1 { top: 5%; left: 5%; width: 90px; height: 90px; fill: #ea580c; }
    .bg-icon-2 { top: 12%; right: 6%; width: 80px; height: 80px; fill: #dc2626; animation-delay: -2s; }
    .bg-icon-3 { bottom: 8%; left: 4%; width: 100px; height: 100px; fill: #ea580c; animation-delay: -4s; }
    .bg-icon-4 { bottom: 15%; right: 5%; width: 85px; height: 85px; fill: #dc2626; animation-delay: -1s; }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-12px) rotate(8deg); }
    }

    .container {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* 상단 프로필 헤더 */
    header {
      text-align: center;
      margin-bottom: 32px;
      padding: 20px 10px;
    }

    .nickname {
      font-size: 2.5rem;
      font-weight: 800;
      color: #ea580c; /* 주황-빨강 포인트 컬러 */
      margin-bottom: 8px;
      word-break: keep-all;
      text-shadow: 1px 1px 2px rgba(234, 88, 12, 0.15);
    }

    .subtitle {
      font-size: 1.25rem;
      color: #7c2d12;
      font-weight: 600;
      word-break: keep-all;
    }

    /* 카드 섹션 */
    .cards-wrapper {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background-color: #ffffff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(234, 88, 12, 0.12);
      border: 2px solid #ffedd5;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(220, 38, 38, 0.18);
      border-color: #fed7aa;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #c2410c;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-icon {
      font-size: 1.5rem;
    }

    /* 펼침/접힘 화살표 아이콘 */
    .arrow-icon {
      font-size: 1.2rem;
      color: #ea580c;
      transition: transform 0.3s ease;
      font-weight: bold;
    }

    .card.active .arrow-icon {
      transform: rotate(180deg);
    }

    /* 카드 숨겨진 설명 영역 */
    .card-details {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, margin-top 0.3s ease, opacity 0.3s ease;
      opacity: 0;
    }

    .card.active .card-details {
      max-height: 200px; /* 상세 설명이 드러나기에 충분한 높이 */
      margin-top: 16px;
      opacity: 1;
    }

    .card-details p {
      font-size: 1.1rem;
      color: #431407;
      background-color: #fff7ed;
      padding: 14px 16px;
      border-radius: 10px;
      border-left: 4px solid #dc2626; /* 강렬한 레드 포인트 */
      word-break: keep-all;
    }

    /* 반응형 글자 크기 조정 */
    @media (max-width: 480px) {
      .nickname {
        font-size: 2rem;
      }
      .subtitle {
        font-size: 1.1rem;
      }
      .card-title {
        font-size: 1.2rem;
      }
      .card-details p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- 배경 장식 SVG 그림들 -->
  <!-- 야구공 그림 -->
  <svg class="bg-icon bg-icon-1" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/>
    <path d="M5.5 5.5 C8 8, 8 16, 5.5 18.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-dasharray="2 1"/>
    <path d="M18.5 5.5 C16 8, 16 16, 18.5 18.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-dasharray="2 1"/>
  </svg>

  <!-- 축구공 그림 -->
  <svg class="bg-icon bg-icon-2" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/>
    <polygon points="12 7 15 9.5 14 13 10 13 9 9.5" stroke="currentColor" stroke-width="1.5" fill="none"/>
    <line x1="12" y1="7" x2="12" y2="2" stroke="currentColor" stroke-width="1.5"/>
    <line x1="15" y1="9.5" x2="20" y2="8" stroke="currentColor" stroke-width="1.5"/>
    <line x1="14" y1="13" x2="18" y2="17" stroke="currentColor" stroke-width="1.5"/>
    <line x1="10" y1="13" x2="6" y2="17" stroke="currentColor" stroke-width="1.5"/>
    <line x1="9" y1="9.5" x2="4" y2="8" stroke="currentColor" stroke-width="1.5"/>
  </svg>

  <!-- 불꽃 장식 그림 -->
  <svg class="bg-icon bg-icon-3" viewBox="0 0 24 24">
    <path d="M12 2C10.5 5 8 8 8 12C8 15.3 10.7 18 14 18C16.8 18 19 15.8 19 13C19 9.5 16 6.5 12 2Z" stroke="currentColor" stroke-width="2" fill="none"/>
    <path d="M11 11C10 12.5 9.5 13.5 9.5 15C9.5 16.7 10.8 18 12.5 18C14 18 15 17 15 15.5C15 13.5 13.5 12 11 11Z" stroke="currentColor" stroke-width="1.5" fill="none"/>
  </svg>

  <!-- 과냥/목표(타겟) 장식 그림 -->
  <svg class="bg-icon bg-icon-4" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/>
    <circle cx="12" cy="12" r="6" stroke="currentColor" stroke-width="1.5" fill="none"/>
    <circle cx="12" cy="12" r="2" stroke="currentColor" stroke-width="2" fill="currentColor"/>
  </svg>

  <div class="container">
    <!-- 헤더 섹션 -->
    <header>
      <h1 class="nickname">🦅 이글스거너</h1>
      <p class="subtitle">한화 이글스와 아스날을 열렬히 응원하는 열정 가득한 스포츠 팬입니다!</p>
    </header>

    <!-- 메인 카드 섹션 -->
    <main class="cards-wrapper">
      
      <!-- 카드 1 -->
      <article class="card" onclick="toggleCard(this)" role="button" tabindex="0" aria-expanded="false">
        <div class="card-header">
          <h2 class="card-title">
            <span class="card-icon">🦅</span>
            <span>좋아하는 것</span>
          </h2>
          <span class="arrow-icon">▼</span>
        </div>
        <div class="card-details">
          <p>박진감 넘치는 야구 관람을 정말 좋아해요! 불꽃 투혼의 한화 이글스를 열렬히 응원하고 있습니다 ⚾</p>
        </div>
      </article>

      <!-- 카드 2 -->
      <article class="card" onclick="toggleCard(this)" role="button" tabindex="0" aria-expanded="false">
        <div class="card-header">
          <h2 class="card-title">
            <span class="card-icon">⚽</span>
            <span>요즘 관심사</span>
          </h2>
          <span class="arrow-icon">▼</span>
        </div>
        <div class="card-details">
          <p>요즘 축구 중계 보는 맛에 푹 빠져있어요. 프리미어리그의 강호 아스날(Arsenal)을 응원합니다 🔴⚪</p>
        </div>
      </article>

      <!-- 카드 3 -->
      <article class="card" onclick="toggleCard(this)" role="button" tabindex="0" aria-expanded="false">
        <div class="card-header">
          <h2 class="card-title">
            <span class="card-icon">🎯</span>
            <span>올해 해 보고 싶은 것</span>
          </h2>
          <span class="arrow-icon">▼</span>
        </div>
        <div class="card-details">
          <p>꾸준히 노력해서 다가오는 시험에서 목표한 최고 점수를 받아내는 것이 가장 큰 목표입니다! 💯</p>
        </div>
      </article>

    </main>
  </div>

  <script>
    // 카드를 클릭했을 때 펼치고 접는 함수
    function toggleCard(cardElement) {
      const isActive = cardElement.classList.contains('active');
      
      // 클릭한 카드의 상태 토글
      if (isActive) {
        cardElement.classList.remove('active');
        cardElement.setAttribute('aria-expanded', 'false');
      } else {
        cardElement.classList.add('active');
        cardElement.setAttribute('aria-expanded', 'true');
      }
    }

    // 키보드 엔터키/스페이스바로도 동작하도록 접근성 추가
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggleCard(card);
        }
      });
    });
  </script>
</body>
</html>
